<!doctype html><html lang="en"><meta charset="utf-8"><title>StreamLore OBS overlay</title><style>body{margin:0;background:transparent;color:#f5f5ee;font:24px system-ui}main{position:absolute;bottom:30px;left:30px;width:420px;padding:24px;border-radius:12px;background:#151819ed;border:1px solid #a8bc8d}small{color:#d4f783;font-size:12px;letter-spacing:2px}h1{font-size:30px;margin:12px 0}p{font-size:15px;color:#bac2b0}progress{width:100%;accent-color:#d4f783}</style><main><small>STREAMLORE / COMMUNITY MOMENT</small><h1 id="title">Waiting for local bridge</h1><progress id="progress" value="0" max="3"></progress><p id="hint">Connect your Twitch account on localhost:8787.</p></main><script type="module">import{moments}from './model.mjs';const es=new EventSource('/api/events');es.addEventListener('state',e=>{const s=JSON.parse(e.data).state,m=moments[s.chapter];document.querySelector('#title').textContent=m.title;document.querySelector('#progress').value=Math.min(3,s.voters.length);document.querySelector('#hint').textContent=s.unlocked.includes(m.id)?'Moment unlocked · !claim '+m.chapter:'Type !moment in chat · '+s.voters.length+'/3 unique voices';});</script></html>
